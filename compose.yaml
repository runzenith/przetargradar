name: przetargradar
x-server: &server
  image: przetargradar-server:local
  build:
    context: .
    dockerfile: infra/Dockerfile
    target: server
  env_file: .env
  environment: &server-env
    DATABASE_URL: mysql://radar:${MYSQL_PASSWORD:-radar_local}@mysql:3306/przetargradar
    HOST: 0.0.0.0
    NODE_ENV: production
  init: true
  stop_grace_period: 30s

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: przetargradar
      MYSQL_USER: radar
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radar_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
    command:
      [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
        '--default-time-zone=+00:00',
      ]
    volumes: ['mysql_data:/var/lib/mysql']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u radar -D przetargradar -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  migrate:
    <<: *server
    command:
      [
        'node_modules/.bin/prisma',
        'migrate',
        'deploy',
        '--schema',
        'packages/database/prisma/schema.prisma',
      ]
    depends_on:
      mysql: { condition: service_healthy }
    restart: 'no'
  api:
    <<: *server
    command: ['node', 'dist/api.js']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *server
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('fs');try{process.exit(Date.now()-fs.statSync('/tmp/przetargradar-worker').mtimeMs<90000?0:1)}catch{process.exit(1)}",
        ]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 4
    restart: unless-stopped
  web:
    image: przetargradar-web:local
    build: { context: ., dockerfile: infra/Dockerfile, target: web }
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  seed:
    <<: *server
    profiles: ['tools']
    command: ['node', 'dist/seed.js']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'
volumes:
  mysql_data:
